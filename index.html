<!DOCTYPE html>
<html>
<head>
  <title>SAM to VoiceMeeter</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px 20px; background: #1e1e1e; color: #fff; margin: 0; user-select: none; }
    .control-group { margin-bottom: 12px; }
    select, input[type="text"], textarea, button { padding: 10px; width: 100%; box-sizing: border-box; background: #2d2d2d; color: white; border: 1px solid #444; border-radius: 4px; margin-top: 5px; }
    button { cursor: pointer; font-weight: bold; }
    
    /* Character Tabs */
    .tabs-container { display: flex; gap: 5px; margin-bottom: 12px; }
    .tab { flex: 1; background: #333; border: 1px solid #444; padding: 8px 5px; font-size: 12px; border-radius: 4px; color: #ccc; text-align: center; }
    .tab:hover { background: #444; }
    .tab.active { background: #0078d7; color: white; border-color: #005a9e; }

    /* Slider Panel */
    .settings-panel { background: #252525; padding: 12px 15px; border-radius: 6px; border: 1px solid #333; margin-bottom: 12px; }
    .slider-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .slider-row label { width: 80px; font-weight: 600; font-size: 13px; }
    .slider-row input[type="range"] { flex-grow: 1; margin: 0 15px; cursor: pointer; }
    .slider-row span { width: 35px; text-align: right; font-family: monospace; font-size: 13px; color: #00a8ff; }
    .divider { border-top: 1px solid #444; margin: 10px 0; padding-top: 10px; }
    
    #speak-btn { background: #0078d7; margin-top: 5px; padding: 10px; }
    #speak-btn:hover { background: #005a9e; }

    /* Soundboard Section */
    .soundboard-header { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; margin-bottom: 8px; }
    .soundboard-header h3 { margin: 0; font-size: 15px; color: #ddd; }
    .soundboard-header span { font-size: 11px; color: #888; }
    
    .soundboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 15px; }
    
    .sb-btn { background: #2a2a2a; border: 1px solid #3d3d3d; border-radius: 4px; padding: 10px 5px; color: #777; font-size: 11px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s; }
    .sb-btn:hover { background: #353535; border-color: #555; }
    .sb-btn.configured { background: #1e3547; border-color: #0078d7; color: #e0f2fe; font-weight: 600; }
    .sb-btn.configured:hover { background: #264761; }
    .sb-btn:active { transform: scale(0.98); }

    /* Edit Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.hidden { display: none; }
    .modal-box { background: #252525; border: 1px solid #444; border-radius: 6px; width: 400px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .modal-actions { display: flex; gap: 8px; margin-top: 15px; }
    .modal-actions button { margin-top: 0; }
    .btn-save { background: #0078d7; border: none; }
    .btn-save:hover { background: #005a9e; }
    .btn-clear { background: #d83b01; border: none; }
    .btn-clear:hover { background: #b83301; }
    .btn-cancel { background: #3d3d3d; border: 1px solid #555; }
    .btn-cancel:hover { background: #4d4d4d; }
  </style>
</head>
<body>

  <h2>SAM Text-to-Speech</h2>
  
  <div class="control-group">
    <label style="font-size: 13px; color: #ccc;">Audio Output (Select VoiceMeeter):</label>
    <select id="device-select" style="padding: 6px;"></select>
  </div>

  <div class="tabs-container" id="tabs"></div>

  <div class="settings-panel">
    <div class="slider-row" style="margin-bottom: 12px;">
      <label>Name</label>
      <input type="text" id="char-name" oninput="updateName()" style="margin-top: 0; padding: 6px;" />
    </div>
    <div class="slider-row">
      <label>Speed</label>
      <input type="range" id="speed" min="0" max="255" oninput="updateVal('speed')">
      <span id="speed-val"></span>
    </div>
    <div class="slider-row">
      <label>Pitch</label>
      <input type="range" id="pitch" min="0" max="255" oninput="updateVal('pitch')">
      <span id="pitch-val"></span>
    </div>
    <div class="slider-row">
      <label>Throat</label>
      <input type="range" id="throat" min="0" max="255" oninput="updateVal('throat')">
      <span id="throat-val"></span>
    </div>
    <div class="slider-row">
      <label>Mouth</label>
      <input type="range" id="mouth" min="0" max="255" oninput="updateVal('mouth')">
      <span id="mouth-val"></span>
    </div>
    <div class="divider slider-row">
      <label>Volume</label>
      <input type="range" id="volume" min="0" max="100" oninput="updateVal('volume')">
      <span id="volume-val"></span>
    </div>
  </div>

  <div class="control-group">
    <input type="text" id="text-input" placeholder="Type here and press Enter..." autofocus />
  </div>
  <button id="speak-btn">Speak</button>

  <div class="soundboard-header">
    <h3>Soundboard</h3>
    <span>Left-click: play | Right-click: edit</span>
  </div>
  <div class="soundboard-grid" id="soundboard-grid"></div>

  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal-box">
      <h3 style="margin-top:0;" id="modal-title">Edit Slot</h3>
      <label style="font-size: 13px;">Button Label (Short):</label>
      <input type="text" id="modal-label-input" placeholder="e.g. Laugh, Warning, GG" />
      
      <label style="font-size: 13px; display:block; margin-top: 10px;">Spoken Text:</label>
      <textarea id="modal-text-input" rows="3" placeholder="What should SAM say?"></textarea>
      
      <div class="modal-actions">
        <button class="btn-save" id="modal-save-btn">Save</button>
        <button class="btn-clear" id="modal-clear-btn">Clear</button>
        <button class="btn-cancel" id="modal-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // Pulling SAM via Node.js instead of a CDN
    const SamJs = require('sam-js');
    let audioCtx;

    const defaultChar = { speed: 72, pitch: 64, throat: 128, mouth: 128, volume: 100 };
    let characters = [];
    let activeIndex = 0;
    let editingSlotIndex = null;

    function createEmptySoundboard() {
      return Array.from({ length: 20 }, (_, i) => ({ label: `Slot ${i + 1}`, text: '' }));
    }

    const savedData = localStorage.getItem('sam_characters');
    if (savedData) {
      characters = JSON.parse(savedData);
      characters.forEach(char => {
        if (!char.soundboard || char.soundboard.length !== 20) {
          char.soundboard = createEmptySoundboard();
        }
      });
    } else {
      for (let i = 0; i < 6; i++) {
        characters.push({ ...defaultChar, name: `Char ${i + 1}`, soundboard: createEmptySoundboard() });
      }
    }

    function saveData() {
      localStorage.setItem('sam_characters', JSON.stringify(characters));
    }

    function renderTabs() {
      const tabsDiv = document.getElementById('tabs');
      tabsDiv.innerHTML = '';
      characters.forEach((char, index) => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (index === activeIndex ? ' active' : '');
        btn.innerText = char.name;
        btn.onclick = () => selectTab(index);
        tabsDiv.appendChild(btn);
      });
    }

    function selectTab(index) {
      activeIndex = index;
      renderTabs();
      loadSliders();
      renderSoundboard();
      document.getElementById('text-input').focus();
    }

    function loadSliders() {
      const char = characters[activeIndex];
      document.getElementById('char-name').value = char.name;
      ['speed', 'pitch', 'throat', 'mouth', 'volume'].forEach(id => {
        document.getElementById(id).value = char[id];
        document.getElementById(id + '-val').innerText = char[id];
      });
    }

    function updateVal(id) {
      const val = document.getElementById(id).value;
      document.getElementById(id + '-val').innerText = val;
      characters[activeIndex][id] = parseInt(val);
      saveData();
    }

    function updateName() {
      const newName = document.getElementById('char-name').value;
      characters[activeIndex].name = newName || `Char ${activeIndex + 1}`;
      renderTabs();
      saveData();
    }

    function renderSoundboard() {
      const grid = document.getElementById('soundboard-grid');
      grid.innerHTML = '';
      const slots = characters[activeIndex].soundboard;

      slots.forEach((slot, idx) => {
        const btn = document.createElement('div');
        const hasText = Boolean(slot.text && slot.text.trim());
        btn.className = 'sb-btn' + (hasText ? ' configured' : '');
        btn.innerText = slot.label || `Slot ${idx + 1}`;
        btn.title = hasText ? `"${slot.text}"` : `Unassigned`;

        btn.addEventListener('click', () => {
          if (hasText) playSam(slot.text);
          else openEditModal(idx);
        });
        btn.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          openEditModal(idx);
        });
        grid.appendChild(btn);
      });
    }

    function openEditModal(slotIndex) {
      editingSlotIndex = slotIndex;
      const slot = characters[activeIndex].soundboard[slotIndex];
      document.getElementById('modal-title').innerText = `Edit Slot ${slotIndex + 1}`;
      document.getElementById('modal-label-input').value = slot.label === `Slot ${slotIndex + 1}` ? '' : slot.label;
      document.getElementById('modal-text-input').value = slot.text;
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.getElementById('modal-label-input').focus();
    }

    function closeEditModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
      editingSlotIndex = null;
    }

    document.getElementById('modal-save-btn').addEventListener('click', () => {
      if (editingSlotIndex === null) return;
      characters[activeIndex].soundboard[editingSlotIndex] = {
        label: document.getElementById('modal-label-input').value.trim() || `Slot ${editingSlotIndex + 1}`,
        text: document.getElementById('modal-text-input').value.trim()
      };
      saveData(); renderSoundboard(); closeEditModal();
    });

    document.getElementById('modal-clear-btn').addEventListener('click', () => {
      if (editingSlotIndex === null) return;
      characters[activeIndex].soundboard[editingSlotIndex] = { label: `Slot ${editingSlotIndex + 1}`, text: '' };
      saveData(); renderSoundboard(); closeEditModal();
    });

    document.getElementById('modal-cancel-btn').addEventListener('click', closeEditModal);

    async function populateDevices() {
      // We no longer need getUserMedia since main.js grants media permission automatically!
      const devices = await navigator.mediaDevices.enumerateDevices();
      const audioOutputs = devices.filter(d => d.kind === 'audiooutput');
      const select = document.getElementById('device-select');
      select.innerHTML = '';
      
      const savedDeviceId = localStorage.getItem('sam_selected_device');
      audioOutputs.forEach(device => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.text = device.label || `Device ${device.deviceId.slice(0,5)}`;
        if (savedDeviceId && device.deviceId === savedDeviceId) option.selected = true;
        else if (!savedDeviceId && option.text.toLowerCase().includes('voicemeeter')) option.selected = true;
        select.appendChild(option);
      });
    }

    document.getElementById('device-select').addEventListener('change', (e) => {
      localStorage.setItem('sam_selected_device', e.target.value);
    });

    async function playSam(text) {
      if (!text || !text.trim()) return;
      if (!audioCtx) audioCtx = new AudioContext();
      
      const deviceId = document.getElementById('device-select').value;
      if (deviceId && audioCtx.setSinkId) await audioCtx.setSinkId(deviceId);

      const char = characters[activeIndex];
      const volume = char.volume / 100;

      // Initialize SAM via the required Node module
      const sam = new SamJs({ speed: char.speed, pitch: char.pitch, throat: char.throat, mouth: char.mouth });
      
      const buffer32 = sam.buf32(text); 
      const audioBuffer = audioCtx.createBuffer(1, buffer32.length, 22050);
      audioBuffer.getChannelData(0).set(buffer32);
      
      const source = audioCtx.createBufferSource();
      const gainNode = audioCtx.createGain();
      
      source.buffer = audioBuffer;
      gainNode.gain.value = volume;
      
      source.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      source.start();
    }

    function speakFromInput() {
      const input = document.getElementById('text-input');
      const text = input.value.trim();
      if (!text) return;
      playSam(text);
      input.value = '';
    }

    document.getElementById('speak-btn').addEventListener('click', speakFromInput);
    document.getElementById('text-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') speakFromInput(); });

    // Initialize UI
    populateDevices();
    renderTabs();
    loadSliders();
    renderSoundboard();
  </script>
</body>
</html>
